; ==============================================================================
; SpaceMentum — DefaultInput.ini
;
; @creator_feel
;   "for pc A and D looks good. only two buttons for now to spin the mace,
;    moment of stopping is the moment of release. everything can be controles by this i think."
;
; @emotional_intent
;   Radical simplicity. Two buttons, one gesture: hold to wind up the spin, let go
;   to unleash the kick. The depth lives in TIMING, not in button count.
;
; Key bindings themselves (A = spin counter-clockwise, D = spin clockwise) live in
; the Input Mapping Context, created in Step 2 (see Docs/TECHNICAL_SPECIFICATIONS.md §4).
; ==============================================================================

[/Script/Engine.InputSettings]
; Route all input through Enhanced Input (UE5 standard).
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Keep the virtual joystick off — mobile touch zones will be designed explicitly
; if/when the mobile platform decision is made (GDD §5).
DefaultTouchInterface=None
bAlwaysShowTouchInterface=False

; Mouse is not used for steering; lock & hide it during play.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
