; ==============================================================================
; SpaceMentum — DefaultEngine.ini
;
; @creator_feel
;   "it has physics."
;   "lets go for quality and hence unreal engine make most sense to me"
;
; @emotional_intent
;   Physics is the soul of this game. The mace must feel genuinely heavy and the
;   whiplash kick must be crisp and reproducible. That is why we pin physics to
;   substepped fixed ticks and remove gravity entirely: in deep space the ONLY
;   forces acting on the astronaut are the forward drift and the mace.
; ==============================================================================

[/Script/EngineSettings.GameMapsSettings]
; Default framework class and startup maps for Step 3 Greybox verification.
EditorStartupMap=/Game/Core/Maps/L_Prototype_Greybox.L_Prototype_Greybox
GameDefaultMap=/Game/Core/Maps/L_Prototype_Greybox.L_Prototype_Greybox
ServerDefaultMap=/Game/Core/Maps/L_Prototype_Greybox.L_Prototype_Greybox
GlobalDefaultGameMode=/Script/SpaceMentumCore.SpaceGreyboxGameMode

[/Script/Engine.PhysicsSettings]
; Deep space: no gravity. The astronaut must never "fall" — only drift and get whipped by the mace.
DefaultGravityZ=0.000000

; Substepping (GDD §3.1.2): the spinning mace head moves very fast along its arc.
; Without substeps it would tunnel through thin obstacles between frames and the
; game would feel unfair — the exact opposite of "thrilling vulnerability".
bSubstepping=True
bSubsteppingAsync=False
; 1/120 s — matches the 120 Hz deterministic tick target (GDD §2.2).
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8

; Determinism hint for replays / ghost runs / leaderboard validation (GDD §2.2).
bEnableEnhancedDeterminism=True

[/Script/Engine.RendererSettings]
; Quality-first: Lumen GI + reflections for emissive hazards and the glowing mace trail.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
; Motion blur fights readability at hyper-velocity; we sell speed via FOV + space dust instead.
r.DefaultFeature.MotionBlur=False

[/Script/Engine.Engine]
; Fixed frame-rate smoothing off — physics determinism comes from substeps, not frame caps.
bSmoothFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.GameUserSettings]
bUseVSync=True
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
WindowMode=1
FullscreenMode=1
FrameRateLimit=120.000000
